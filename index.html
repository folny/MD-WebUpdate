<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metal Detector Update</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #a00000, #800000);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: #f8fafc;
        }
        .container {
            background-color: #bb0000;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid #d00000;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 25px;
            font-size: 1.8em;
            font-weight: 700;
        }
        .section {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #d00000;
        }
        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .web-file-selection-wrapper {
            margin-bottom: 15px;
        }
        button {
            padding: 12px 25px;
            border: 2px solid #000000;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.1s ease, border-color 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 250px;
            margin-top: 10px;
            cursor: pointer;
        }
        button#uploadButton {
            background-color: #10B981;
            color: white;
            box-shadow: 0 4px 8px rgba(16, 185, 129, 0.3);
        }
        button#uploadButton:hover {
            background-color: #059669;
            transform: translateY(-2px);
            border-color: #333333;
        }
        button:disabled {
            background-color: #660000;
            color: #d00000;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            border-color: #440000;
            pointer-events: none;
        }
        button#connectDisconnectButton {
            background-color: #4a90e2;
            color: white;
            box-shadow: 0 4px 8px rgba(74, 144, 226, 0.3);
            margin-bottom: 15px;
        }
        button#connectDisconnectButton:hover {
            background-color: #357bd8;
            transform: translateY(-2px);
            border-color: #333333;
        }
        #message {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
            word-wrap: break-word;
            text-align: left;
            border: 1px solid;
            color: #f8fafc;
        }
        .message.success {
            background-color: #10b981;
            border-color: #059669;
        }
        .message.error {
            background-color: #f00000;
            border-color: #d00000;
        }
        .message.info {
            background-color: #4a90e2;
            border-color: #357bd8;
        }
        .message.warn {
            background-color: #facc15;
            color: #1e293b;
            border-color: #eab308;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #f8fafc;
            font-size: 0.95em;
        }
        .progress-container {
            width: 100%;
            background-color: #d00000;
            border-radius: 5px;
            margin-top: 20px;
            height: 25px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            border: 2px solid #000000;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: transparent;
            border-radius: 5px;
            text-align: right;
            color: white;
            line-height: 25px;
            font-size: 0.85em;
            transition: width 0.3s ease, background-color 0.3s ease;
            position: absolute;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            padding-right: 5px;
            box-sizing: border-box;
        }
        .progress-bar.filled {
            background-color: #10B981;
        }
        .progress-text {
            position: absolute;
            width: 100%;
            text-align: center;
            color: white;
            font-weight: 600;
            z-index: 1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        #webFirmwareSelect {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #d00000;
            background-color: #660000;
            color: #f8fafc;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Metal Detector Update</h1>

        <div class="section">
            <button id="connectDisconnectButton">Pripojiť zariadenie</button>

            <div class="web-file-selection-wrapper section">
                <select id="webFirmwareSelect" class="mt-2" disabled>
                    <option value="">Vyberte verziu Firmware</option>
                </select>
            </div>

            <button id="uploadButton" disabled>Nahrať Firmware</button>

            <div class="progress-container" id="overallProgressContainer">
                <span class="progress-text" id="progressStatusText">0%</span>
                <div class="progress-bar" id="overallProgressBar"></div>
            </div>
        </div>

        <div id="message" class="message info hidden"></div>
    </div>

    <script>
        const uploadButton = document.getElementById('uploadButton');
        const messageDisplay = document.getElementById('message');
        const connectDisconnectButton = document.getElementById('connectDisconnectButton');
        const webFirmwareSelect = document.getElementById('webFirmwareSelect');

        const overallProgressContainer = document.getElementById('overallProgressContainer');
        const overallProgressBar = document.getElementById('overallProgressBar');
        const progressStatusText = document.getElementById('progressStatusText');

        let selectedFile = null;
        let hidDevice = null;
        let isConnected = false;
        let isUploading = false;
        let firmwareListLoaded = false;

        // --- Constants from C code ---
        const SECTOR_SIZE = 1024;
        const HID_TX_PAYLOAD_BYTE_COUNT = 64;
        const HID_RX_PAYLOAD_BYTE_COUNT = 8;
        const VID = 0x1209;
        const PID = 0xBEBA;
        const FIRMWARE_VER = 0x0300;
        const FIRMWARE_DISPLAY_VERSION = "v1.0.5 HID Boot";
        const HID_REPORT_ID = 0x00;

        const CMD_RESET_PAGES_PAYLOAD = new Uint8Array([0x42, 0x54, 0x4C, 0x44, 0x43, 0x4D, 0x44, 0x00]);
        const CMD_REBOOT_MCU_PAYLOAD = new Uint8Array([0x42, 0x54, 0x4C, 0x44, 0x43, 0x4D, 0x44, 0x01]);

        const ERASE_PROGRESS_END = 5;
        const WRITE_PROGRESS_START = ERASE_PROGRESS_END;
        const WRITE_PROGRESS_END = 95;
        const TOTAL_PROCESS_END = 100;

        const GITHUB_REPO_API_URL = 'https://api.github.com/repos/folny/MD-WebUpdate/contents/Update';

        function isCompatibleDevice(device) {
            return Boolean(device) && device.vendorId === VID && device.productId === PID;
        }

        function assertDeviceConnected() {
            if (!isConnected || !hidDevice || !hidDevice.opened) {
                throw new Error('Zariadenie bolo odpojené.');
            }
        }

        function showMessage(text, type) {
            messageDisplay.classList.remove('hidden', 'success', 'error', 'info', 'warn');
            messageDisplay.textContent = text;
            messageDisplay.className = `message ${type}`;
            console.log(`[${type.toUpperCase()}] ${text}`);
        }

        function updateProgressBar(percentage) {
            if (percentage > 0) {
                overallProgressBar.classList.add('filled');
            } else {
                overallProgressBar.classList.remove('filled');
            }
            overallProgressBar.style.width = `${percentage}%`;
            progressStatusText.textContent = `${Math.round(percentage)}%`;

            if (percentage > 50) {
                progressStatusText.classList.add('white');
            } else {
                progressStatusText.classList.remove('white');
            }
        }

        function resetProgressBar() {
            overallProgressBar.classList.remove('filled');
            overallProgressBar.style.width = '0%';
            progressStatusText.textContent = '0%';
            progressStatusText.classList.remove('white');
        }

        function updateButtonStates() {
            webFirmwareSelect.disabled = isUploading || !isConnected || !firmwareListLoaded || webFirmwareSelect.options.length <= 1;
            uploadButton.disabled = isUploading || !isConnected || !selectedFile;
            connectDisconnectButton.textContent = isConnected ? 'Odpojiť zariadenie' : 'Pripojiť zariadenie';
            connectDisconnectButton.disabled = isUploading;
        }

        async function usbWrite(device, reportId, payload) {
            assertDeviceConnected();
            let retries = 20;
            const dataToSend = new Uint8Array(HID_TX_PAYLOAD_BYTE_COUNT);
            dataToSend.set(payload);

            while (retries > 0) {
                assertDeviceConnected();
                try {
                    await device.sendReport(reportId, dataToSend);
                    return true;
                } catch (error) {
                    if (!isConnected || !device.opened) {
                        throw new Error('Zariadenie bolo počas zápisu odpojené.');
                    }
                    if (error.name === 'NetworkError' && error.message.includes('A transfer error has occurred')) {
                        console.warn(`[USB Write] Retries left: ${retries}. Error: ${error.message}`);
                        await new Promise(resolve => setTimeout(resolve, 100));
                        retries--;
                    } else if (error instanceof DOMException && error.name === 'NotAllowedError') {
                        showMessage(`USB Chyba zápisu: Prístup zamietnutý alebo zariadenie odpojené. ${error.message}`, 'error');
                        console.error('USB Write NotAllowedError:', error);
                        return false;
                    } else {
                        showMessage(`USB Chyba zápisu: Nepredvídaná chyba: ${error.message}`, 'error');
                        console.error('USB Write Unexpected Error:', error);
                        throw error;
                    }
                }
            }
            showMessage('USB Chyba zápisu: Zlyhalo po viacerých opakovaniach.', 'error');
            return false;
        }

        function waitForAck(device, timeoutMs) {
            return new Promise((resolve, reject) => {
                if (!isConnected || !device || !device.opened) {
                    reject(new Error('Zariadenie bolo odpojené pred prijatím ACK.'));
                    return;
                }

                let timeoutId;

                const cleanup = () => {
                    clearTimeout(timeoutId);
                    device.removeEventListener('inputreport', onInputReport);
                    device.removeEventListener('disconnect', onDisconnectedWhileWaiting);
                };

                const onDisconnectedWhileWaiting = () => {
                    cleanup();
                    reject(new Error('Zariadenie bolo počas čakania na ACK odpojené.'));
                };

                const onInputReport = (event) => {
                    console.log(`[InputReport] ID: 0x${event.reportId.toString(16)}, Data: [${new Uint8Array(event.data.buffer).map(b => b.toString(16).padStart(2, '0')).join(', ')}], Length: ${event.data.byteLength}`);

                    if (event.reportId === HID_REPORT_ID && event.data.byteLength === HID_RX_PAYLOAD_BYTE_COUNT) {
                        const rxData = new Uint8Array(event.data.buffer);
                        if (rxData[7] === 0x02) {
                            console.log("ACK received and matches 0x02.");
                            cleanup();
                            resolve();
                        } else {
                            console.warn(`ACK: Received data, but byte 7 is 0x${rxData[7].toString(16)}. Expected 0x02. Full data: [${Array.from(rxData).map(b => b.toString(16).padStart(2, '0')).join(', ')}]`);
                        }
                    }
                };

                device.addEventListener('inputreport', onInputReport);
                device.addEventListener('disconnect', onDisconnectedWhileWaiting);

                timeoutId = setTimeout(() => {
                    cleanup();
                    reject(new Error('ACK Timeout: Failed to get acknowledgment from device in time. Check browser console for detailed logs.'));
                }, timeoutMs);
            });
        }

        function updateConnectionMessage() {
            if (isConnected) {
                showMessage(`Zariadenie pripojené. Verzia Firmware: ${FIRMWARE_DISPLAY_VERSION}. Vyberte verziu Firmware.`, 'success');
            } else {
                showMessage('Váš prehliadač podporuje potrebné rozhranie. Pre plnú funkčnosť pripojte zariadenie cez USB.', 'info');
            }
        }

        function handleHidError(hidError) {
            if (hidError instanceof DOMException && hidError.name === 'SecurityError') {
                showMessage(
                    'Chyba zabezpečenia WebHID: Prehliadač odmietol prístup k USB HID zariadeniam kvôli politike povolení. ' +
                    'Uistite sa, že aplikácia je spustená cez HTTPS a prehliadač má povolenia (v nastaveniach stránky). ' +
                    'Lokálne súbory alebo HTTP spojenia nemajú prístup k WebHID.',
                    'error'
                );
            } else if (hidError instanceof DOMException && hidError.name === 'NotAllowedError') {
                showMessage('WebHID: Prístup k zariadeniu bol zamietnutý alebo zrušený používateľom.', 'error');
            } else if (hidError instanceof DOMException && hidError.name === 'NotFoundError') {
                showMessage('WebHID: Zariadenie nebolo nájdené alebo vybrané.', 'error');
            } else {
                showMessage(`Neočekávaná chyba WebHID pri pripojení: ${hidError.message}. Skontrolujte konzolu prehliadača pre detailné logy.`, 'error');
            }
            console.error('WebHID Error:', hidError);
        }

        async function openHidDevice(device, isAutoConnect = false) {
            if (!device || !isCompatibleDevice(device)) return false;

            if (isConnected && hidDevice === device && hidDevice.opened) {
                return true;
            }

            try {
                if (hidDevice && hidDevice !== device) {
                    hidDevice.removeEventListener('disconnect', onDeviceDisconnected);
                    if (hidDevice.opened) {
                        await hidDevice.close();
                    }
                }

                if (!device.opened) {
                    await device.open();
                }

                device.removeEventListener('disconnect', onDeviceDisconnected);
                device.addEventListener('disconnect', onDeviceDisconnected);

                hidDevice = device;
                isConnected = true;
                resetProgressBar();
                updateConnectionMessage();

                if (!firmwareListLoaded) {
                    await fetchFirmwareFilesFromWeb();
                } else {
                    updateButtonStates();
                }

                return true;
            } catch (error) {
                isConnected = false;
                hidDevice = null;
                if (isAutoConnect) {
                    console.warn('Auto-connect failed, user can click Connect button:', error);
                    showMessage('Zistené spárované zariadenie, ale automatické otvorenie zlyhalo. Kliknite na "Pripojiť zariadenie".', 'warn');
                    updateButtonStates();
                } else {
                    handleHidError(error);
                    updateButtonStates();
                }
                return false;
            }
        }

        async function autoConnectPairedDevice() {
            if (!navigator.hid || isConnected || isUploading) return;

            try {
                const devices = await navigator.hid.getDevices();
                const matchedDevice = devices.find(isCompatibleDevice);
                if (matchedDevice) {
                    console.log('Found paired compatible HID device, auto-connecting:', matchedDevice);
                    await openHidDevice(matchedDevice, true);
                }
            } catch (error) {
                console.warn('Could not check paired HID devices:', error);
            }
        }

        async function connectDevice() {
            if (!navigator.hid) {
                showMessage('Váš prehliadač nepodporuje potrebné rozhranie. Použite prehliadač Google Chrome alebo Microsoft Edge.', 'error');
                updateButtonStates();
                return;
            }

            try {
                showMessage(`Vyhľadávam zariadenie...`, 'info');
                const devices = await navigator.hid.requestDevice({
                    filters: [{ vendorId: VID, productId: PID }]
                });

                if (devices.length === 0) {
                    showMessage(`Žiadne zariadenie nebolo vybrané alebo nájdené.`, 'error');
                    return;
                }

                await openHidDevice(devices[0], false);
            } catch (hidError) {
                handleHidError(hidError);
            } finally {
                updateButtonStates();
            }
        }

        /**
         * Disconnects the HID device and resets UI/state.
         * @param {{ silent?: boolean, fromSystemDisconnect?: boolean }} options
         */
        async function disconnectDevice(options = {}) {
            const { silent = false, fromSystemDisconnect = false } = options;
            const currentDevice = hidDevice;
            const wasConnected = isConnected || Boolean(currentDevice);

            if (fromSystemDisconnect) {
                isUploading = false;
            }

            isConnected = false;
            hidDevice = null;
            selectedFile = null;
            webFirmwareSelect.value = "";

            if (currentDevice) {
                currentDevice.removeEventListener('disconnect', onDeviceDisconnected);
                if (currentDevice.opened && !fromSystemDisconnect) {
                    try {
                        await currentDevice.close();
                    } catch (error) {
                        console.warn('Error closing HID device during disconnect:', error);
                    }
                }
            }

            if (fromSystemDisconnect) {
                resetProgressBar();
            }

            updateButtonStates();

            if (!silent) {
                if (wasConnected) {
                    showMessage('Zariadenie bolo odpojené.', 'info');
                } else {
                    showMessage('Žiadne zariadenie nie je pripojené na odpojenie.', 'warn');
                }
            }
        }

        function onDeviceDisconnected(event) {
            const disconnectedDevice = event.device;
            if (!disconnectedDevice || !isCompatibleDevice(disconnectedDevice)) {
                return;
            }

            if (!hidDevice || disconnectedDevice === hidDevice || isConnected) {
                console.log("Compatible HID device disconnected:", disconnectedDevice);
                const wasUploading = isUploading;
                disconnectDevice({ silent: true, fromSystemDisconnect: true });
                if (wasUploading) {
                    showMessage('Kábel bol počas nahrávania odpojený. Zariadenie bolo odpojené a priebeh resetovaný.', 'error');
                } else {
                    showMessage('Zariadenie bolo odpojené. Pre pokračovanie ho pripojte cez USB.', 'info');
                }
            }
        }

        async function fetchFirmwareFilesFromWeb() {
            firmwareListLoaded = false;
            webFirmwareSelect.innerHTML = '<option value="">Načítavam súbory...</option>';
            webFirmwareSelect.disabled = true;

            try {
                const response = await fetch(GITHUB_REPO_API_URL);
                if (!response.ok) {
                    throw new Error(`HTTP chyba! Stav: ${response.status}`);
                }
                const data = await response.json();
                const binFiles = data.filter(item => item.type === 'file' && item.name.endsWith('.bin'));

                if (binFiles.length === 0) {
                    webFirmwareSelect.innerHTML = '<option value="">Žiadne aktualizácie neboli najdené</option>';
                    firmwareListLoaded = false;
                } else {
                    webFirmwareSelect.innerHTML = '<option value="">Vyberte verziu Firmware</option>';
                    binFiles.forEach(file => {
                        const option = document.createElement('option');
                        option.value = file.download_url;
                        option.textContent = file.name.replace(/\.bin$/i, '');
                        webFirmwareSelect.appendChild(option);
                    });
                    firmwareListLoaded = true;
                }
            } catch (error) {
                webFirmwareSelect.innerHTML = '<option value="">Žiadne aktualizácie neboli najdené</option>';
                firmwareListLoaded = false;
                console.error('GitHub fetch error:', error);
            } finally {
                updateButtonStates();
            }
        }

        async function readFileContent(fileSource) {
            if (fileSource && fileSource.url) {
                try {
                    const response = await fetch(fileSource.url);
                    if (!response.ok) {
                        throw new Error(`HTTP chyba pri sťahovaní: ${response.status}`);
                    }
                    const buffer = await response.arrayBuffer();
                    showMessage(`Súbor '${fileSource.name}' stiahnutý.`, 'success');
                    return buffer;
                } catch (error) {
                    throw new Error(`Chyba pri sťahovaní súboru z webu: ${error.message}`);
                }
            }
            throw new Error('Nepodporovaný typ súboru na čítanie. Očakáva sa objekt s URL.');
        }

        webFirmwareSelect.addEventListener('change', (event) => {
            const selectedUrl = event.target.value;
            if (selectedUrl) {
                selectedFile = {
                    name: webFirmwareSelect.options[webFirmwareSelect.selectedIndex].textContent + '.bin',
                    url: selectedUrl
                };
                const displayedFileName = webFirmwareSelect.options[webFirmwareSelect.selectedIndex].textContent;
                showMessage(`Pripravený na nahrávanie verzie: ${displayedFileName}`, 'info');
            } else {
                selectedFile = null;
                showMessage('Prosím vyberte verziu Firmware.', 'warn');
            }
            updateButtonStates();
            resetProgressBar();
        });

        uploadButton.addEventListener('click', async () => {
            if (!selectedFile) {
                showMessage('Prosím, najprv vyberte súbor Firmware z webu.', 'error');
                return;
            }
            if (!isConnected || !hidDevice) {
                showMessage('Zariadenie nie je pripojené. Prosím, pripojte zariadenie, aby ste mohli pokračovať.', 'error');
                updateButtonStates();
                return;
            }

            const fileName = selectedFile.name;
            const fileExtension = fileName.split('.').pop().toLowerCase();
            if (fileExtension !== 'bin') {
                showMessage('Prosím, vyberte súbor Firmware s príponou .bin.', 'error');
                return;
            }

            showMessage('Firmware sa nahráva...', 'info');
            isUploading = true;
            updateButtonStates();
            resetProgressBar();

            try {
                const fileContentBuffer = await readFileContent(selectedFile);
                assertDeviceConnected();

                showMessage('Firmware sa nahráva...', 'info');

                // Phase 1: Erase
                if (!(await usbWrite(hidDevice, HID_REPORT_ID, CMD_RESET_PAGES_PAYLOAD))) {
                    showMessage('Chyba pri odosielaní príkazu na vymazanie (<reset pages>).', 'error');
                    throw new Error('Chyba odosielania príkazu na vymazanie.');
                }
                await new Promise(resolve => setTimeout(resolve, 500));
                assertDeviceConnected();
                updateProgressBar(ERASE_PROGRESS_END);

                // Phase 2: Write
                let totalBytesFlashed = 0;
                const totalFileBytes = fileContentBuffer.byteLength;
                const ACK_TIMEOUT_MS = 1024;

                for (let pageOffset = 0; pageOffset < totalFileBytes; pageOffset += SECTOR_SIZE) {
                    assertDeviceConnected();
                    const pageData = new Uint8Array(fileContentBuffer.slice(pageOffset, pageOffset + SECTOR_SIZE));

                    for (let i = 0; i < pageData.length; i += HID_TX_PAYLOAD_BYTE_COUNT) {
                        assertDeviceConnected();
                        const chunk = pageData.subarray(i, i + HID_TX_PAYLOAD_BYTE_COUNT);
                        if (!(await usbWrite(hidDevice, HID_REPORT_ID, chunk))) {
                            showMessage('Chyba pri nahrávaní dát Firmware (chunk).', 'error');
                            throw new Error('Chyba odosielania dát Firmware.');
                        }
                        totalBytesFlashed += chunk.length;
                        const writePhaseProgressFactor = (totalBytesFlashed / totalFileBytes);
                        const overallProgress = WRITE_PROGRESS_START + (writePhaseProgressFactor * (WRITE_PROGRESS_END - WRITE_PROGRESS_START));
                        updateProgressBar(overallProgress);
                    }

                    const isLastPage = (pageOffset + SECTOR_SIZE >= totalFileBytes);
                    if (!isLastPage) {
                        try {
                            await waitForAck(hidDevice, ACK_TIMEOUT_MS);
                        } catch (ackError) {
                            showMessage(`Nahrávanie Firmware: ${ackError.message}. Proces zastavený. Skontrolujte konzolu prehliadača pre detailné logy.`, 'error');
                            throw ackError;
                        }
                    } else {
                        console.log("Skipping ACK for the last page as requested.");
                    }
                }

                // Final Steps: Reboot and close device
                assertDeviceConnected();
                if (!(await usbWrite(hidDevice, HID_REPORT_ID, CMD_REBOOT_MCU_PAYLOAD))) {
                    showMessage('Chyba pri odosielaní príkazu <reboot mcu>. Zariadenie nemusí reštartovať správne.', 'error');
                    throw new Error('Chyba odosielania príkazu na reštart.');
                } else {
                    showMessage('Príkaz <reboot mcu> odoslaný. Zariadenie by sa malo reštartovať.', 'success');
                }

                await disconnectDevice({ silent: true });

                showMessage('Firmware bol úspešne nahratý. Zariadenie bolo odpojené.', 'success');
                updateProgressBar(TOTAL_PROCESS_END);

                selectedFile = null;
                webFirmwareSelect.value = "";
                updateButtonStates();

            } catch (error) {
                const disconnectedDuringUpload = !isConnected || !hidDevice;
                await disconnectDevice({ silent: true, fromSystemDisconnect: disconnectedDuringUpload });
                if (disconnectedDuringUpload) {
                    resetProgressBar();
                    showMessage(`Nahrávanie prerušené: ${error.message} Zariadenie bolo odpojené a priebeh resetovaný.`, 'error');
                } else {
                    showMessage(`Nahrávanie zlyhalo: ${error.message}. Zariadenie bolo odpojené a priebeh resetovaný.`, 'error');
                    resetProgressBar();
                }
                console.error('General upload error:', error);
            } finally {
                isUploading = false;
                updateButtonStates();
            }
        });

        connectDisconnectButton.addEventListener('click', () => {
            if (isConnected) {
                disconnectDevice();
            } else {
                connectDevice();
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            if (!navigator.hid) {
                showMessage('Váš prehliadač nepodporuje potrebné rozhranie. Použite prehliadač Google Chrome alebo Microsoft Edge.', 'error');
                uploadButton.disabled = true;
                connectDisconnectButton.disabled = true;
                connectDisconnectButton.textContent = 'Prehliadač nepodporovaný !';
                webFirmwareSelect.disabled = true;
            } else {
                showMessage('Váš prehliadač podporuje potrebné rozhranie. Pre plnú funkčnosť pripojte zariadenie cez USB.', 'info');
                updateButtonStates();
                resetProgressBar();
                await fetchFirmwareFilesFromWeb();
                await autoConnectPairedDevice();
            }
        });

        if (navigator.hid) {
            navigator.hid.addEventListener('connect', async (event) => {
                console.log("HID device connected externally:", event.device);
                if (isCompatibleDevice(event.device)) {
                    if (!firmwareListLoaded) {
                        await fetchFirmwareFilesFromWeb();
                    }
                    if (!isConnected && !isUploading) {
                        await openHidDevice(event.device, true);
                    }
                }
            });

            navigator.hid.addEventListener('disconnect', onDeviceDisconnected);
        }
    </script>
</body>
</html>
